# Four radars on the corners of a ~14 km area, four targets (one per class).
# All numbers are synthetic and non-operational.
name: nominal
description: Nominal conditions, four radars, one target of each behaviour class.
site: {name: "Utah Valley · US", lat: 40.30, lon: -111.70}
dt: 0.5
duration_s: 120
area_radius_m: 6500
seed: 0
max_track_slots: 6
terrain: {source: auto}   # real elevation tiles, procedural hills when offline

radar_defaults:
  fov_az_deg: 60          # +-60 deg array face
  search_sector_deg: 120
  r_max_m: 14000

radars:
  - {name: R1, position: [-6000, -5000, 15], heading_deg: 40}
  - {name: R2, position: [ 6000, -5000, 15], heading_deg: 140}
  - {name: R3, position: [ 6000,  5000, 15], heading_deg: -140}
  - {name: R4, position: [-6000,  5000, 15], heading_deg: -40}

targets:
  - {label: 0}
  - {label: 1}
  - {label: 2}
  - {label: 3}
