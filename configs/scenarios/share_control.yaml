# Nominal layout with the measurement-sharing decision enabled (share_actions).
# All numbers are synthetic and non-operational.
name: share_control
description: Nominal layout; every radar action also decides whether its reports are sent to the fusion centre (fusion participation), with a small communication cost in the reward.
site: {name: "Utah Valley · US", lat: 40.30, lon: -111.70}
dt: 0.5
duration_s: 60
area_radius_m: 6500
seed: 0
max_track_slots: 6
terrain: {source: auto}   # real elevation tiles, procedural hills when offline

radar_defaults:
  fov_az_deg: 60          # +-60 deg array face
  search_sector_deg: 120
  r_max_m: 14000

radars:
  - {name: R1, position: [-6000, -5000, 15], heading_deg: 40}
  - {name: R2, position: [ 6000, -5000, 15], heading_deg: 140}
  - {name: R3, position: [ 6000,  5000, 15], heading_deg: -140}
  - {name: R4, position: [-6000,  5000, 15], heading_deg: -40}

targets:
  - {target_class: uav}
  - {target_class: aircraft}
  - {target_class: missile}

share_actions: true
reward: {w_comm: 0.05}
