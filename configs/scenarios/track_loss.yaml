# Nominal layout with a 20 s detection outage on all radars (e.g. jamming).
# The outage is longer than the tracker's 15 s confirmed-track timeout, so
# tracks are deleted (track loss) and must be reacquired afterwards.
# All numbers are synthetic and non-operational.
name: track_loss
description: Nominal layout; all radars detect nothing between 25 s and 45 s, forcing track loss and reacquisition.
site: {name: "Utah Valley · US", lat: 40.30, lon: -111.70}
dt: 0.5
duration_s: 60
area_radius_m: 6500
seed: 0
max_track_slots: 6
terrain: {source: auto}

radar_defaults:
  fov_az_deg: 60
  search_sector_deg: 120
  r_max_m: 14000

radars:
  - {name: R1, position: [-6000, -5000, 15], heading_deg: 40}
  - {name: R2, position: [ 6000, -5000, 15], heading_deg: 140}
  - {name: R3, position: [ 6000,  5000, 15], heading_deg: -140}
  - {name: R4, position: [-6000,  5000, 15], heading_deg: -40}

targets:
  - {target_class: uav}
  - {target_class: aircraft}
  - {target_class: missile}

stress:
  outages:
    - [all, 25, 45]
