# Dense scene for the tracking study: the nominal four-radar layout with
# twelve targets (three of each behaviour class).  More targets than one radar
# can serve with track dwells at the same time, so data association, track
# management and the radars' time budget are all stressed.
# All numbers are synthetic and non-operational.
name: multi_target
description: Twelve targets (three per class) in the nominal four-radar layout.
site: {name: "Utah Valley · US", lat: 40.30, lon: -111.70}
dt: 0.5
duration_s: 120
area_radius_m: 6500
seed: 2
max_track_slots: 12
terrain: {source: auto}   # real elevation tiles, procedural hills when offline

radar_defaults:
  fov_az_deg: 60
  search_sector_deg: 120
  r_max_m: 14000

radars:
  - {name: R1, position: [-6000, -5000, 15], heading_deg: 40}
  - {name: R2, position: [ 6000, -5000, 15], heading_deg: 140}
  - {name: R3, position: [ 6000,  5000, 15], heading_deg: -140}
  - {name: R4, position: [-6000,  5000, 15], heading_deg: -40}

targets:
  - {label: 0}
  - {label: 1}
  - {label: 2}
  - {label: 3}
  - {label: 0}
  - {label: 1}
  - {label: 2}
  - {label: 3}
  - {label: 0}
  - {label: 1}
  - {label: 2}
  - {label: 3}
