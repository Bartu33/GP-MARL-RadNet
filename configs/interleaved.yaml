# Same layout as "nominal", but radars may also choose the INTERLEAVED mode
# (short search sweep + track dwell in one step) and the reward includes a
# load-equalisation term.  This is our working interpretation of the
# "equalization" mode from the meeting notes (doc/research/radar_modes.md).
name: interleaved
description: Nominal layout with interleaved search+track actions and a load-equalisation reward term.
site: {name: "Utah Valley · US", lat: 40.30, lon: -111.70}
dt: 0.5
duration_s: 120
area_radius_m: 6500
seed: 4
max_track_slots: 6
terrain: {source: auto}   # real elevation tiles, procedural hills when offline
interleaved_actions: true

radar_defaults:
  fov_az_deg: 60
  search_sector_deg: 120
  r_max_m: 14000

radars:
  - {name: R1, position: [-6000, -5000, 15], heading_deg: 40}
  - {name: R2, position: [ 6000, -5000, 15], heading_deg: 140}
  - {name: R3, position: [ 6000,  5000, 15], heading_deg: -140}
  - {name: R4, position: [-6000,  5000, 15], heading_deg: -40}

targets:
  - {label: 0}
  - {label: 1}
  - {label: 2}
  - {label: 3}

reward:
  w_fair: 0.5
