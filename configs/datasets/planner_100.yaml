recipe_version: 1
master_seed: 2026
episodes: 100
base_scenario: nominal
scenario_family: explicit_motion_gaussian_pool
max_attempts: 5
split_ratios: {train: 0.70, validation: 0.15, test: 0.15}

overrides:
  duration_s: 30
  targets:
    - label: 0
      position: [0, 0, 700]
      velocity: [40, 0, 0]
      motion: {model: CV}

terrain_pools:
  train:
    - seed: 11
      terrain:
        source: procedural
        resolution: 128
        hills:
          - {center_m: [-2500, -1500], height_m: 300, sigma_m: 600}
  validation:
    - seed: 22
      terrain:
        source: procedural
        resolution: 128
        hills:
          - {center_m: [2500, 1500], height_m: 400, sigma_m: 700}
  test:
    - seed: 33
      terrain:
        source: procedural
        resolution: 128
        hills:
          - {center_m: [-2500, 1500], height_m: 500, sigma_m: 800}

randomization:
  "targets[0].label": {choice: [0, 1, 2, 3]}
  "targets[0].position":
    uniform: {low: [-1000, -1000, 600], high: [1000, 1000, 1200]}
  "targets[0].velocity":
    uniform: {low: [-60, -60, -2], high: [60, 60, 2]}
  "targets[0].motion":
    choice:
      - {model: CV}
      - {model: CT, turn_rate_rad_s: 0.02}
      - {model: CA, acceleration_mps2: [0.3, 0, 0]}
  "stress.noise_scale": {uniform: {low: 0.75, high: 2.0}}
  "stress.comm_drop_prob": {uniform: {low: 0.0, high: 0.4}}
